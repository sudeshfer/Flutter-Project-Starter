include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/gen/**"
    - "build/**"
    - android/**
    - ios/**
  errors:
    # freezed/json_serializable annotations on constructors trigger this.
    invalid_annotation_target: ignore

linter:
  rules:
    # This is an application, not a published package: dartdoc on every public
    # member adds noise. Document non-obvious APIs instead.
    public_member_api_docs: false
    # Import rule (enforced): ALWAYS use package imports, never relative ones.
    # See docs/ARCHITECTURE.md → "Import rule".
    always_use_package_imports: true
